name: Public Browser Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-browser:
    name: Verify public browser surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run public browser gate
        run: npm run test:browser:public

      - name: Run deterministic human product shell smoke
        run: npm run smoke:human-product-shell-cross-browser

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
