<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Palacio municipal con arcos coloniales y campanario</title>
  <desc id="desc">Ilustración editorial monocromática de una institución municipal inspirada en la arquitectura de Antigua Guatemala, con fachada, arcos coloniales, cúpula, campanario y plaza documental.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1eb"/>
      <stop offset="1" stop-color="#eaded5"/>
    </linearGradient>
    <linearGradient id="burgundy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e2a43"/>
      <stop offset="1" stop-color="#5b1020"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5b1020" flood-opacity=".12"/>
    </filter>
    <pattern id="fineGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#731729" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <style>
      .outline{fill:none;stroke:#731729;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .detail{fill:none;stroke:#731729;stroke-opacity:.48;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .stone{fill:#fffaf6;stroke:#731729;stroke-width:2.2;stroke-linejoin:round}
      .shade{fill:#f2e5e2;stroke:#731729;stroke-width:2.2;stroke-linejoin:round}
      .window{fill:#731729;fill-opacity:.08;stroke:#731729;stroke-width:1.8}
    </style>
  </defs>

  <rect width="1200" height="560" fill="url(#paper)"/>
  <rect width="1200" height="560" fill="url(#fineGrid)"/>
  <circle cx="930" cy="120" r="170" fill="#731729" opacity=".035"/>
  <circle cx="250" cy="430" r="220" fill="#731729" opacity=".028"/>

  <path class="detail" d="M94 448H1106M155 486H1045M230 520H970"/>
